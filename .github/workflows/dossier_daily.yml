name: dossier-latam-diario

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write
  issues: write

jobs:
  run-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_GITHUB_ISSUE: 'true'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ONLY_OPEN: 'true'
          MIN_SCORE: '3.0'
          MAX_LINKS_PER_SOURCE: '12'
          HTTP_TIMEOUT_SECONDS: '15'
          MAX_WORKERS: '10'
        run: python src/dossier_tracker.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dossier-latam-report
          path: |
            reports/
            data/latest_items.json
            data/new_items.json
            docs/data/dashboard.json
            docs/data/latest.xlsx

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/data/
          git diff --cached --quiet && echo "Sin cambios, nada que commitear." && exit 0
          git commit -m "chore: actualizar dossier y dashboard $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
